<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RitManager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RitManager">
<meta name="theme-color" content="#0b1220">
<style>
:root{--bg:#0b1220;--card:#162033;--line:#26344d;--blue:#00b7e6;--pink:#ff3d8b;--green:#10b981;--red:#ef4444;--tx:#f1f5f9;--mu:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
html,body{background:var(--bg);color:var(--tx);min-height:100%}
body{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 30px)}
.wrap{max-width:460px;margin:0 auto}.wrap>*{margin-bottom:14px}
header{display:flex;justify-content:space-between;align-items:center;font-size:1.25rem;font-weight:800}
.pill{font-size:.75rem;font-weight:600;padding:5px 10px;border-radius:99px;border:1px solid var(--green);color:var(--green)}
.pill.off{border-color:var(--mu);color:var(--mu)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:8px;text-align:center;margin-bottom:14px}
.stats small{display:block;font-size:.68rem;color:var(--mu);margin-bottom:3px}
.stats b{font-size:1.3rem}
.main{width:100%;height:84px;border:0;border-radius:20px;background:linear-gradient(135deg,#00b7e6,#3a7bd5);color:#fff;font-size:1.35rem;font-weight:800}
.main.on{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.note{font-size:.8rem;color:var(--mu);margin-top:10px;text-align:center}
.banner{background:#3b2f0b;border:1px solid #a16207;color:#fde68a;border-radius:14px;padding:10px 12px;font-size:.85rem}
.row{display:flex;justify-content:space-between;align-items:center}
.row h2{font-size:1.05rem}
.sm{background:var(--card);border:1px solid var(--line);color:var(--blue);padding:7px 11px;border-radius:99px;font-size:.8rem;font-weight:600;margin-left:6px;display:inline-block}
.trip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.badge{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px}
.badge.z{background:#00b7e622;color:var(--blue)}.badge.p{background:#ff3d8b22;color:var(--pink)}
.sub{font-size:.8rem;color:var(--mu);margin-top:3px}
.d{font-size:.9rem;margin-top:6px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(3,7,18,.88);display:none;padding:16px;z-index:9;overflow:auto}
.modal.on{display:flex}
.modal .card{width:100%;max-width:380px;margin:auto}
.modal h3{margin-bottom:6px}
label.f{display:block;font-size:.78rem;color:var(--mu);margin:12px 0 4px}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:#fff;font-size:1rem;-webkit-user-select:text;user-select:text}
.btns{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;margin-top:14px}
.btn{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:1rem;font-weight:700;width:100%;margin-top:0}
.btn.z{background:#00b7e633;color:var(--blue)}.btn.p{background:#ff3d8b33;color:var(--pink)}
.btn.go{background:var(--blue);color:#04202b;border:0}.btn.r{color:var(--red)}
.btn.full{margin-top:10px}
.warn{border-radius:14px;padding:10px 12px;font-size:.88rem;font-weight:600;background:#3b2f0b;border:1px solid #a16207;color:#fde68a}
.warn.red{background:#3b0d0d;border-color:#b91c1c;color:#fecaca}
.tot .stats{margin:12px 0 0}
#per{width:auto;padding:6px 10px;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <header><span>🚗 RitManager</span><span id="net" class="pill">online</span></header>
  <div id="banner" class="banner" hidden></div>
  <div id="warn" class="warn" hidden></div>
  <div id="calib" class="warn" hidden></div>
  <section class="card">
    <div class="stats">
      <div><small data-i="dist"></small><b id="km">0,0</b></div>
      <div><small data-i="time"></small><b id="time">00:00</b></div>
      <div><small data-i="prec"></small><b id="acc">–</b></div>
    </div>
    <button id="main" class="main">START RIT</button>
    <p id="note" class="note"></p>
  </section>
  <section class="card tot">
    <div class="row"><b data-i="km"></b><select id="per"><option value="y" data-i="yr"></option><option value="m" data-i="mo"></option><option value="a" data-i="al"></option></select></div>
    <div class="stats"><div><small data-i="biz"></small><b id="tZ">0</b></div><div><small data-i="prv"></small><b id="tP">0</b></div><div><small data-i="tot"></small><b id="tT">0</b></div></div>
  </section>
  <div class="row"><h2 data-i="trips"></h2>
    <div><button class="sm" id="bCsv">CSV</button><button class="sm" id="bJson" data-i="backup"></button><label class="sm"><span data-i="restore"></span><input type="file" id="fImp" accept=".json,application/json" hidden></label></div>
  </div>
  <div id="list"></div>
</div>

<div class="modal" id="mStart"><div class="card">
  <h3 data-i="newTrip"></h3>
  <label class="f" data-i="plate"></label><input id="kenteken" placeholder="AB-123-C" autocapitalize="characters">
  <label class="f" data-i="odo"></label><input id="kmBegin" type="number" inputmode="numeric" data-p="odoPh"><p class="sub" id="kmHint"></p>
  <div class="btns"><button class="btn z" id="sZ" data-i="biz"></button><button class="btn p" id="sP" data-i="prv"></button></div>
  <button class="btn full" id="sCancel" data-i="cancel"></button>
</div></div>

<div class="modal" id="mStop"><div class="card">
  <h3 data-i="endTrip"></h3><p class="sub" id="stopInfo"></p>
  <label class="f" data-i="odo"></label><input id="kmEind" type="number" inputmode="numeric">
  <label class="f" data-i="desc"></label><input id="desc" data-p="descPh">
  <button class="btn go full" id="fSave" data-i="save"></button>
  <button class="btn r full" id="fDiscard" data-i="discard"></button>
</div></div>

<div class="modal" id="mEdit"><div class="card">
  <h3 data-i="edit"></h3>
  <label class="f" data-i="type"></label><select id="eType"><option value="Zakelijk" data-i="biz"></option><option value="Privé" data-i="prv"></option></select>
  <label class="f" data-i="plate"></label><input id="eKt" autocapitalize="characters">
  <label class="f" data-i="begin"></label><input id="eB" type="number" inputmode="numeric">
  <label class="f" data-i="end"></label><input id="eE" type="number" inputmode="numeric">
  <label class="f" data-i="from"></label><input id="eSA">
  <label class="f" data-i="to"></label><input id="eEA">
  <label class="f" data-i="descS"></label><input id="eD">
  <button class="btn go full" id="eSave" data-i="save"></button>
  <div class="btns"><button class="btn r" id="eDel" data-i="del"></button><button class="btn" id="eCancel" data-i="close"></button></div>
</div></div>

 trips.forEach(function(t){var d=new Date(t.start);
  if(p==='y'&&d.getFullYear()!==n.getFullYear())return;
  if(p==='m'&&(d.getFullYear()!==n.getFullYear()||d.getMonth()!==n.getMonth()))return;
  if(t.type==='Zakelijk')z+=km(t);else pr+=km(t)});
 var jp=0;trips.forEach(function(t){if(t.type!=='Zakelijk'&&new Date(t.start).getFullYear()===n.getFullYear())jp+=km(t)});
 jp=Math.round(jp*10)/10;var w=$('warn');
 if(jp>=500){w.hidden=false;w.className='warn red';w.textContent=_('w500',fmt(jp))}
 else if(jp>=400){w.hidden=false;w.className='warn';w.textContent=_('w400',fmt(jp),fmt(Math.round((500-jp)*10)/10))}
 else w.hidden=true;
 z=Math.round(z*10)/10;pr=Math.round(pr*10)/10;
 $('tZ').textContent=fmt(z);$('tP').textContent=fmt(pr);$('tT').textContent=fmt(Math.round((z+pr)*10)/10);
}
function driving(){return active&&!active.end}

/* ---------- Rit starten / bijhouden ---------- */
async function startTrip(type){
 var kt=$('kenteken').value.trim().toUpperCase();
 active={id:Date.now(),start:new Date().toISOString(),end:null,type:type,kenteken:kt,kmBegin:num($('kmBegin').value),begReal:sugBegin==null||num($('kmBegin').value)!==sugBegin,kmEind:null,
  gps:0,sLat:null,sLng:null,eLat:null,eLng:null,sAddr:'',eAddr:'',desc:''};
 await put('kv',kt,'kenteken');await put('kv',active,'active');
 closeM('mStart');runTrip();
}
function runTrip(){
 setDriving(true);lastPt=active.eLat!=null?{lat:active.eLat,lng:active.eLng,t:Date.now()}:null;
 if(!navigator.geolocation){$('note').textContent=_('nogps');return}
 watchId=navigator.geolocation.watchPosition(onPos,function(e){$('note').textContent=_('gpserr',e.message)},{enableHighAccuracy:true,maximumAge:0,timeout:30000});
 lock();clearInterval(tick);tick=setInterval(showTime,1000);showTime();
}
function onPos(p){
 var c=p.coords;$('acc').textContent=Math.round(c.accuracy)+' m';
 if(!driving()||c.accuracy>30)return;                      // onnauwkeurige punten negeren
 var pt={lat:c.latitude,lng:c.longitude,t:p.timestamp};
 if(active.sLat==null){active.sLat=pt.lat;active.sLng=pt.lng}
 if(lastPt){var d=dist(lastPt,pt),dt=(pt.t-lastPt.t)/1000;
  if(d<0.015)return;                                        // GPS-ruis bij stilstand negeren
  if(dt>0&&d/dt>0.07)return;                                // onmogelijke sprongen (>250 km/u) negeren
  active.gps+=d}
 lastPt=pt;active.eLat=pt.lat;active.eLng=pt.lng;
 $('km').textContent=fmt(active.gps.toFixed(1));
 put('kv',active,'active');                                  // continu bewaren: rit blijft behouden
}
function showTime(){if(!active)return;var s=Math.floor((Date.now()-new Date(active.start))/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
 $('time').textContent=(h?h+':':'')+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function setDriving(on){var b=$('main');b.classList.toggle('on',on);b.textContent=_(on?'stop':'start');
 $('note').textContent=on?_('wakeLock' in navigator?'wakeOk':'wakeNo'):'';
 if(!on){$('km').textContent=fmt('0.0');$('time').textContent='00:00';$('acc').textContent='–'}}
async function lock(){try{if('wakeLock' in navigator&&driving())wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&driving())lock()});

async function stopTrip(){
 if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null;clearInterval(tick);
 if(wake){wake.release().catch(function(){});wake=null}
 active.end=new Date().toISOString();await put('kv',active,'active');setDriving(false);openStop();
}
function openStop(){
 sugEind=active.kmBegin!=null?active.kmBegin+Math.round(active.gps):null;
 $('stopInfo').textContent=_('stopInfo',fmt(active.gps.toFixed(1)))+(active.kmBegin!=null?_('stopBeg',active.kmBegin):'')+(sugEind!=null?_('stopSug'):'');
 $('kmEind').value=sugEind==null?'':sugEind;$('desc').value='';openM('mStop');
}
async function finishTrip(){
 var e=num($('kmEind').value);
 if(e!=null&&active.kmBegin!=null&&e<active.kmBegin){alert(_('errLow'));return}
 active.kmEind=e;active.eindGps=e!=null&&e===sugEind;active.desc=$('desc').value.trim();active.gps=Math.round(active.gps*1000)/1000;
 await put('trips',active);await del('kv','active');active=null;
 closeM('mStop');await load();lookup();banner();
}
async function discardTrip(){if(!confirm(_('confirmDiscard')))return;await del('kv','active');active=null;closeM('mStop')}

/* ---------- Lijst ---------- */
async function load(){trips=await all('trips');render()}
function render(){
 totals();var L=$('list');L.textContent='';
 if(!trips.length)L.appendChild(el('p','note',_('none')));
 trips.slice().sort(function(a,b){return b.id-a.id}).forEach(function(t){
  var d=new Date(t.start),e=t.end?new Date(t.end):null,it=el('div','trip'),h=el('div','th');
  h.appendChild(el('span','badge '+(t.type==='Zakelijk'?'z':'p'),tp(t.type)));h.appendChild(el('b',null,fmt(km(t))+' km'));it.appendChild(h);
  it.appendChild(el('div','sub',d.toLocaleDateString(LOC)+' '+hm(d)+(e?' – '+hm(e):'')+(t.kenteken?' · '+t.kenteken:'')));
  it.appendChild(el('div','sub',_('from2')+(t.sAddr||(t.sLat!=null?_('addrSoon'):_('unk')))));
  it.appendChild(el('div','sub',_('to2')+(t.eAddr||(t.eLat!=null?_('addrSoon'):_('unk')))));
  it.appendChild(el('div','sub',_('odoL')+q(t.kmBegin)+' → '+q(t.kmEind)+(t.eindGps?_('est'):'')+' · GPS: '+fmt(t.gps.toFixed(1))+' km'));
  it.appendChild(el('div','d',dsc(t)));
  it.onclick=function(){openEdit(t.id)};L.appendChild(it)});
}
function openEdit(id){
 var t=trips.filter(function(x){return x.id===id})[0];if(!t)return;editId=id;
 $('eType').value=t.type;$('eKt').value=t.kenteken||'';$('eB').value=t.kmBegin==null?'':t.kmBegin;$('eE').value=t.kmEind==null?'':t.kmEind;
 $('eSA').value=t.sAddr||'';$('eEA').value=t.eAddr||'';$('eD').value=t.desc==='Geen omschrijving'?'':t.desc;openM('mEdit');
}
async function saveEdit(){
 var t=trips.filter(function(x){return x.id===editId})[0];
 t.type=$('eType').value;t.kenteken=$('eKt').value.trim().toUpperCase();t.kmBegin=num($('eB').value);var ne=num($('eE').value);if(ne!==t.kmEind)t.eindGps=false;t.kmEind=ne;
 t.sAddr=$('eSA').value.trim();t.eAddr=$('eEA').value.trim();t.desc=$('eD').value.trim();
 await put('trips',t);closeM('mEdit');render();
}
async function delTrip(){if(!confirm(_('confirmDel')))return;await del('trips',editId);closeM('mEdit');await load();banner()}

/* ---------- Adressen opzoeken zodra er wifi is (OpenStreetMap, gratis) ---------- */
async function rev(la,lo){try{var r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language='+LG+'&lat='+la+'&lon='+lo);
 if(!r.ok)return '';var a=(await r.json()).address||{};
 return [((a.road||'')+(a.house_number?' '+a.house_number:'')).trim(),a.postcode||'',a.city||a.town||a.village||''].filter(Boolean).join(', ')}catch(e){return ''}}
async function lookup(){
 if(looking||!navigator.onLine)return;looking=true;
 try{for(var i=0;i<trips.length;i++){var t=trips[i],ch=false;
  for(var k=0;k<2;k++){var p=k?'e':'s';
   if(!t[p+'Addr']&&t[p+'Lat']!=null){var a=await rev(t[p+'Lat'],t[p+'Lng']);if(a){t[p+'Addr']=a;ch=true}await sleep(1100)}}
  if(ch)await put('trips',t)}}catch(e){}
 looking=false;render();
}

/* ---------- Export / backup / herstel ---------- */
function cell(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
async function out(name,text,type){
 var f=new File([text],name,{type:type});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true}}catch(e){if(e.name==='AbortError')return false}
 var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();return true;
}
async function exportCsv(){
 var rows=[_('csvH').split('|').join(SEP)];
 trips.slice().sort(function(a,b){return a.id-b.id}).forEach(function(t){var d=new Date(t.start),e=t.end?new Date(t.end):null;
  rows.push([t.kenteken,d.toLocaleDateString(LOC),hm(d),e?hm(e):'',tp(t.type),t.kmBegin,t.kmEind,fmt(km(t)),fmt(t.gps.toFixed(2)),t.sAddr,t.eAddr,dsc(t)].map(cell).join(SEP))});
 await out(_('csvF')+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+rows.join('\r\n'),'text/csv');
}
async function exportJson(){
 var ok=await out('RitManager_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({v:1,trips:trips}),'application/json');
 if(ok){await put('kv',Date.now(),'lastBackup');banner()}
}
async function importJson(ev){
 var f=ev.target.files[0];if(!f)return;
 try{var j=JSON.parse(await f.text());if(!j.trips||!j.trips.length)throw 0;
  for(var i=0;i<j.trips.length;i++)await put('trips',j.trips[i]);await load();banner();alert(_('restored',j.trips.length))}
 catch(e){alert(_('badFile'))}
 ev.target.value='';
}
async function banner(){
 var b=$('banner'),lb=await get('kv','lastBackup'),old=!lb||Date.now()-lb>7*864e5;
 if(trips.length&&old){b.hidden=false;b.textContent=_('bk',lb?_('bkLast',new Date(lb).toLocaleDateString(LOC)):_('bkNever'))}else b.hidden=true;
}

/* ---------- Start ---------- */
function net(){var n=$('net');n.textContent=_(navigator.onLine?'on':'off');n.className='pill'+(navigator.onLine?'':' off')}
window.addEventListener('online',function(){net();lookup()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){net();lookup()}});window.addEventListener('offline',net);
$('main').onclick=function(){if(driving())return stopTrip();
 var l=lastEind();sugBegin=l;$('kmBegin').value=l==null?'':l;
 $('kmHint').textContent=l==null?'':(estCount()>=5?_('hintCal'):_('hintAuto'));openM('mStart')};
$('per').onchange=totals;
$('sZ').onclick=function(){startTrip('Zakelijk')};$('sP').onclick=function(){startTrip('Privé')};$('sCancel').onclick=function(){closeM('mStart')};
$('fSave').onclick=finishTrip;$('fDiscard').onclick=discardTrip;
$('eSave').onclick=saveEdit;$('eDel').onclick=delTrip;$('eCancel').onclick=function(){closeM('mEdit')};
$('bCsv').onclick=exportCsv;$('bJson').onclick=exportJson;$('fImp').onchange=importJson;

(async function(){
 applyLang();
 try{await idb()}catch(e){alert(_('noStore'));return}
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 var kt=await get('kv','kenteken');if(kt)$('kenteken').value=kt;
 await load();active=(await get('kv','active'))||null;
 if(active){if(active.end)openStop();else runTrip()}   // rit hervatten na herstart
 banner();lookup();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
})();
</script>
